<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>manemu 名單管理</title>
<style>
  :root{
    --paper:#F6F7F5; --ink:#1C2726; --ink-2:#5A6B68; --line:#DDE3E0; --chip:#ECEFED;
    --me:#C0392B; --them:#33587A; --ok:#2E7D4F; --ok-soft:#E3F0E8; --warn:#9A6B00; --warn-soft:#F7EFD8;
  }
  @media (prefers-color-scheme: dark){ :root{
    --paper:#151D1C; --ink:#E8ECEA; --ink-2:#93A29E; --line:#2A3634; --chip:#222C2A;
    --me:#E05A48; --them:#7BA3CC; --ok:#63B588; --ok-soft:#1D2E25; --warn:#D9A93F; --warn-soft:#33290F;
  }}
  *{box-sizing:border-box; margin:0}
  body{
    font-family:"PingFang TC","Hiragino Sans","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
    background:var(--paper); color:var(--ink); line-height:1.6;
    max-width:860px; margin:0 auto; padding:28px 20px 60px;
  }
  h1{font-size:22px; letter-spacing:.02em}
  h1 small{font-size:12px; font-weight:400; color:var(--ink-2); margin-left:10px; letter-spacing:.1em}
  h2{font-size:15px; margin:32px 0 10px; padding-bottom:6px; border-bottom:1px solid var(--line); letter-spacing:.04em}
  h2 .count{color:var(--ink-2); font-weight:400; font-size:13px; margin-left:6px}
  table{width:100%; border-collapse:collapse; font-size:14px}
  th,td{text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); vertical-align:middle}
  th{font-size:11.5px; letter-spacing:.08em; color:var(--ink-2); font-weight:600}
  td.email{word-break:break-all}
  .tier{display:inline-block; font-size:11.5px; padding:2px 8px; border-radius:99px; background:var(--chip); color:var(--ink-2)}
  .tier.admin{background:var(--warn-soft); color:var(--warn)}
  .tier.custom{background:var(--ok-soft); color:var(--ok)}
  .ts{font-size:12px; color:var(--ink-2); font-variant-numeric:tabular-nums}
  input,select,button{font:inherit; font-size:14px}
  input[type=email],input[type=text],select{
    padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:var(--paper); color:var(--ink);
  }
  input[type=email]{min-width:230px}
  button{padding:8px 13px; border-radius:8px; border:1px solid var(--line); background:var(--chip); color:var(--ink); cursor:pointer}
  button.primary{background:var(--ink); color:var(--paper); border-color:var(--ink); font-weight:600}
  button.danger{color:var(--me); border-color:var(--me)}
  button:hover{filter:brightness(.96)}
  button:focus-visible{outline:2px solid var(--them); outline-offset:2px}
  form.add{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:14px 0 4px}
  .hint{font-size:12.5px; color:var(--ink-2); margin-top:6px}
  .empty{font-size:13.5px; color:var(--ink-2); padding:14px 6px}
  #toast{
    position:fixed; left:50%; bottom:24px; transform:translateX(-50%);
    background:var(--ink); color:var(--paper); padding:10px 16px; border-radius:10px; font-size:13.5px;
    opacity:0; transition:opacity .2s; pointer-events:none; max-width:90vw;
  }
  #toast.show{opacity:1}
  .gate{padding:40px 0; font-size:15px}
  .gate a{color:var(--them)}
  .row-actions{display:flex; gap:6px; align-items:center; flex-wrap:wrap}
</style>
</head>
<body>
<div id="gate" class="gate">載入中…</div>

<div id="main" hidden>
  <h1>名單管理<small id="whoami"></small></h1>

  <h2>等候名單<span class="count" id="waitCount"></span></h2>
  <div id="waitBox"></div>

  <h2>已核准名單<span class="count" id="allowCount"></span></h2>
  <form class="add" id="addForm">
    <input type="email" id="addEmail" placeholder="email@example.com" required>
    <select id="addTier"></select>
    <input type="text" id="addCustom" placeholder="或自訂秒數" size="10" inputmode="numeric">
    <button class="primary" type="submit">加入名單</button>
  </form>
  <p class="hint" id="tierHint"></p>
  <div id="allowBox"></div>
</div>

<div id="toast"></div>

<script src="/admin.js"></script>
</body>
</html>
