<title>manemu まねむ — Mockup v2.1</title>
<style>
  :root{
    --paper:#F6F7F5; --ink:#1C2726; --ink-2:#5A6B68; --line:#DDE3E0;
    --me:#C0392B; --me-soft:#F7E8E5; --them:#33587A; --them-soft:#E7EDF3;
    --ok:#2E7D4F; --ok-soft:#E3F0E8; --warn:#9A6B00; --warn-soft:#F7EFD8;
    --chip:#ECEFED; --shadow:0 10px 30px rgba(28,39,38,.14);
    --phone-bg:#E8EBE9; --ghost:#9AA8A4;
  }
  @media (prefers-color-scheme: dark){ :root{
    --paper:#151D1C; --ink:#E8ECEA; --ink-2:#93A29E; --line:#2A3634;
    --me:#E05A48; --me-soft:#3A2320; --them:#7BA3CC; --them-soft:#1E2B38;
    --ok:#63B588; --ok-soft:#1D2E25; --warn:#D9A93F; --warn-soft:#33290F;
    --chip:#222C2A; --shadow:0 10px 30px rgba(0,0,0,.5);
    --phone-bg:#0D1312; --ghost:#5E6E6A;
  }}
  :root[data-theme="dark"]{
    --paper:#151D1C; --ink:#E8ECEA; --ink-2:#93A29E; --line:#2A3634;
    --me:#E05A48; --me-soft:#3A2320; --them:#7BA3CC; --them-soft:#1E2B38;
    --ok:#63B588; --ok-soft:#1D2E25; --warn:#D9A93F; --warn-soft:#33290F;
    --chip:#222C2A; --shadow:0 10px 30px rgba(0,0,0,.5);
    --phone-bg:#0D1312; --ghost:#5E6E6A;
  }
  :root[data-theme="light"]{
    --paper:#F6F7F5; --ink:#1C2726; --ink-2:#5A6B68; --line:#DDE3E0;
    --me:#C0392B; --me-soft:#F7E8E5; --them:#33587A; --them-soft:#E7EDF3;
    --ok:#2E7D4F; --ok-soft:#E3F0E8; --warn:#9A6B00; --warn-soft:#F7EFD8;
    --chip:#ECEFED; --shadow:0 10px 30px rgba(28,39,38,.14);
    --phone-bg:#E8EBE9; --ghost:#9AA8A4;
  }
  *{box-sizing:border-box; margin:0}
  html,body{height:100%}
  body{
    font-family:"PingFang TC","Hiragino Sans","Microsoft JhengHei","Noto Sans TC","Noto Sans JP",system-ui,sans-serif;
    background:var(--phone-bg); color:var(--ink);
    display:flex; align-items:center; justify-content:center; gap:28px;
    padding:24px; min-height:100vh;
  }
  .meta{width:230px; font-size:13px; color:var(--ink-2); line-height:1.6}
  .meta h1{font-size:16px; color:var(--ink); margin-bottom:6px}
  .meta p{margin-bottom:12px}
  .meta .knob{display:block; width:100%; text-align:left; margin-bottom:8px; padding:8px 12px;
    border:1px solid var(--line); border-radius:8px; background:var(--paper); color:var(--ink);
    font:inherit; font-size:13px; cursor:pointer}
  .meta .knob:hover{border-color:var(--ink-2)}
  button:focus-visible{outline:2px solid var(--them); outline-offset:2px}
  .phone{
    width:390px; height:800px; background:var(--paper); border-radius:34px;
    box-shadow:var(--shadow); overflow:hidden; position:relative;
    border:1px solid var(--line); display:flex; flex-direction:column;
  }
  @media (max-width:760px){
    body{padding:0; gap:0; display:block}
    .meta{display:none}
    .phone{width:100%; height:100vh; height:100dvh; border-radius:0; border:none}
  }

  /* ---------- 登入前(v2.1:SSO 在上,示範用真氣泡向下長) ---------- */
  .login{flex:1; overflow-y:auto; display:flex; flex-direction:column; padding:40px 26px 26px}
  .wordmark{font-size:34px; font-weight:800; letter-spacing:.04em}
  .wordmark .kana{font-size:15px; font-weight:500; color:var(--ink-2); margin-left:10px; letter-spacing:.3em}
  .login .tag{color:var(--ink-2); font-size:14.5px; line-height:1.75; margin:12px 0 22px; text-wrap:balance}
  .login .tag b{color:var(--ink); font-weight:600}
  .login .tag .mane{color:var(--me); font-weight:700} .login .tag .mu{color:var(--them); font-weight:700}
  .sso{border:none; background:var(--ink); color:var(--paper);
    border-radius:12px; padding:15px; font:inherit; font-size:15px; font-weight:700; cursor:pointer; flex:none}
  .login .fine{font-size:11px; color:var(--ink-2); line-height:1.7; margin:10px 0 20px}
  .demoBtn{border:1px dashed var(--line); background:transparent; color:var(--ink-2);
    border-radius:12px; padding:12px; font:inherit; font-size:13.5px; cursor:pointer; flex:none}
  .demoStream{display:flex; flex-direction:column; gap:12px; padding:16px 2px 8px}
  .demoStream .msg{max-width:88%}
  .demoStream .bubble{font-size:14px}
  .demoNote{font-size:11.5px; color:var(--ghost); text-align:center; padding:6px 0 0}

  /* ---------- 頂列 ---------- */
  .top{display:flex; align-items:center; gap:6px; padding:12px 12px 8px; border-bottom:1px solid var(--line); flex:none; flex-wrap:wrap}
  .sceneBtn{font:inherit; font-size:12.5px; border:1px solid var(--line); background:var(--chip);
    color:var(--ink); border-radius:8px; padding:6px 9px; cursor:pointer; margin-right:auto}
  .langBtn{font:inherit; font-size:12px; border:1px solid var(--line); background:transparent;
    color:var(--ink-2); border-radius:8px; padding:6px 9px; cursor:pointer}
  .seg{display:flex; border:1px solid var(--line); border-radius:8px; overflow:hidden}
  .seg button{font:inherit; font-size:12px; padding:6px 9px; border:none; background:transparent; color:var(--ink-2); cursor:pointer}
  .seg button[aria-pressed="true"]{background:var(--ink); color:var(--paper)}
  .engine{font-size:11px; padding:5px 8px; border-radius:99px; border:1px solid var(--line);
    background:var(--chip); color:var(--ink-2); cursor:pointer; font-family:inherit}
  .engine[data-fast="true"]{border-color:var(--warn); color:var(--warn); background:var(--warn-soft)}
  .testChip{font-size:11px; padding:5px 8px; border-radius:99px; border:1px solid var(--line);
    background:transparent; color:var(--ink-2); cursor:pointer; font-family:inherit}
  .testChip[data-on="true"]{border-color:var(--them); color:var(--them); background:var(--them-soft)}

  /* ---------- 測試模式橫幅 ---------- */
  .testbar{
    flex:none; font-size:13px; padding:9px 14px; background:var(--them-soft); color:var(--them);
    border-bottom:1px solid var(--line); line-height:1.5;
  }
  .testbar b{font-weight:700}
  .testbar .rec{display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--me); margin-right:6px; animation:blink 1.2s infinite}
  @keyframes blink{50%{opacity:.25}}
  @media (prefers-reduced-motion: reduce){ .testbar .rec{animation:none} }

  /* ---------- 對談模式 ---------- */
  .chatwrap{flex:1; display:flex; flex-direction:column; min-height:0}
  .stream{flex:1; overflow-y:auto; padding:16px 14px; display:flex; flex-direction:column; gap:14px}
  .ghost{
    align-self:stretch; border:1.5px dashed var(--line); border-radius:14px; padding:12px 14px;
    color:var(--ghost); font-size:13.5px; line-height:1.7;
  }
  .ghost b{color:var(--ink-2); font-weight:600}
  .ghost .gx{display:block; margin-top:2px}
  .msg{max-width:84%; display:flex; flex-direction:column; gap:4px}
  .msg.me{align-self:flex-end; align-items:flex-end}
  .msg.them{align-self:flex-start; align-items:flex-start}
  .who{font-size:11px; letter-spacing:.08em; color:var(--ink-2)}
  .bubble{padding:10px 13px; border-radius:14px; font-size:15px; line-height:1.55;
    background:var(--paper); position:relative; user-select:none; -webkit-user-select:none}
  .msg.me .bubble{background:var(--me-soft); border-top-right-radius:4px}
  .msg.them .bubble{background:var(--them-soft); border-top-left-radius:4px}
  .src{font-size:13px; color:var(--ink-2); margin-bottom:4px}
  .msg.me .tx{color:var(--me)} .msg.them .tx{color:var(--them)}
  .tx{font-weight:600}
  .rowmeta{display:flex; gap:6px; align-items:center; font-size:11px; color:var(--ink-2)}
  .lat{font-variant-numeric:tabular-nums; background:var(--chip); border-radius:5px; padding:1px 6px}
  .badge{border-radius:5px; padding:1px 8px; cursor:pointer; border:none; font:inherit; font-size:11px}
  .badge.ok{background:var(--ok-soft); color:var(--ok)}
  .badge.warn{background:var(--warn-soft); color:var(--warn)}
  .backtx{font-size:12.5px; color:var(--ink-2); border-left:3px solid var(--warn);
    padding:6px 10px; margin-top:6px; background:var(--warn-soft); border-radius:0 8px 8px 0}
  .backtx.ok{border-color:var(--ok); background:var(--ok-soft)}
  .hint{font-size:11px; color:var(--warn)}
  .redoflag{font-size:11px; color:var(--ink-2); text-decoration:line-through; opacity:.7}
  .speaking .bubble{outline:2px solid currentColor; outline-offset:1px}

  .pttbar{flex:none; display:flex; gap:10px; padding:12px 14px calc(14px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line); background:var(--paper)}
  .ptt{flex:1; border:none; border-radius:16px; padding:16px 10px 14px; font:inherit; cursor:pointer;
    color:#fff; display:flex; flex-direction:column; align-items:center; gap:3px;
    touch-action:none; user-select:none; -webkit-user-select:none; transition:transform .08s, filter .12s}
  .ptt .big{font-size:15.5px; font-weight:700}
  .ptt .sub{font-size:11px; opacity:.85}
  .ptt.me{background:var(--me)} .ptt.them{background:var(--them)}
  .ptt:disabled{filter:grayscale(.6) brightness(.75); cursor:not-allowed}
  .ptt.holding{transform:scale(.97)}
  .statusline{flex:none; text-align:center; font-size:12px; color:var(--ink-2); padding:6px 0 0;
    min-height:22px; font-variant-numeric:tabular-nums}
  .wave{display:inline-flex; gap:2px; align-items:flex-end; height:10px; margin-left:6px}
  .wave i{width:3px; background:currentColor; border-radius:2px; animation:wv .7s ease-in-out infinite}
  .wave i:nth-child(2){animation-delay:.15s}.wave i:nth-child(3){animation-delay:.3s}.wave i:nth-child(4){animation-delay:.45s}
  @keyframes wv{0%,100%{height:3px}50%{height:10px}}
  @media (prefers-reduced-motion: reduce){ .wave i{animation:none; height:6px} }

  /* ---------- 面對面模式(v2:同級字、氣泡配色) ---------- */
  .facewrap{flex:1; display:flex; flex-direction:column; min-height:0}
  .half{flex:1; display:flex; flex-direction:column; min-height:0}
  .half.other{transform:rotate(180deg)}
  .half .feed{flex:1; overflow-y:auto; padding:12px 14px; display:flex; flex-direction:column; gap:10px; justify-content:flex-end}
  .fmsg{max-width:88%; padding:10px 14px; border-radius:14px; font-size:19px; line-height:1.5; font-weight:600}
  .fmsg small{display:block; font-size:11px; font-weight:400; margin-top:3px; opacity:.75; letter-spacing:.05em}
  .fmsg.me{align-self:flex-end; background:var(--me-soft); color:var(--me); border-top-right-radius:4px}
  .fmsg.them{align-self:flex-start; background:var(--them-soft); color:var(--them); border-top-left-radius:4px}
  .fmsg .fbadge{font-size:12px; vertical-align:3px; margin-left:8px; border-radius:5px; padding:0 7px; font-weight:600}
  .fbadge.ok{background:var(--ok-soft); color:var(--ok)} .fbadge.warn{background:var(--warn-soft); color:var(--warn)}
  .fghost{border:1.5px dashed var(--line); border-radius:14px; padding:10px 14px; color:var(--ghost); font-size:13px; line-height:1.65}
  .half .fptt{flex:none; margin:0 14px 12px; border:none; border-radius:14px; padding:13px; font:inherit;
    color:#fff; cursor:pointer; touch-action:none; user-select:none; -webkit-user-select:none; font-size:15px; font-weight:700}
  .half.mine .fptt{background:var(--me)} .half.other .fptt{background:var(--them)}
  .half .fptt:disabled{filter:grayscale(.6) brightness(.75)}
  .half .fstatus{flex:none; text-align:center; font-size:11.5px; color:var(--ink-2); padding:4px 0; min-height:20px}
  .divider{flex:none; display:flex; align-items:center; justify-content:center; gap:10px;
    border-top:1px dashed var(--line); border-bottom:1px dashed var(--line);
    padding:5px; font-size:11px; color:var(--ink-2); letter-spacing:.08em}
  .hidden{display:none !important}
</style>

<aside class="meta">
  <h1>manemu まねむ Mockup v2.1</h1>
  <p>v2.1:登入頁改版——品牌文案(まね×夢)、SSO 上移、示範用真氣泡向下生長(含誤聽→重講展示)。其餘同 v2:場景/語言切換、引導例句、測試模式。</p>
  <button class="knob" id="kTheme">🌗 深/淺色</button>
  <button class="knob" id="kReset">↺ 重播劇本</button>
  <button class="knob" id="kLogout">⏏ 回登入前頁</button>

</aside>

<div class="phone">
  <!-- ============ 登入前(v2.1) ============ -->
  <div class="login" id="loginScreen">
    <div class="wordmark">manemu<span class="kana">まねむ</span></div>
    <p class="tag">
      <span class="mane">まね</span>是模仿,<span class="mu">む</span>是夢。<br>

    <button class="sso" id="ssoBtn">使用 Google 登入</button>

    <button class="demoBtn" id="demoBtn">▶ 看 30 秒示範:在拉麵店,聽錯了怎麼辦</button>
    <div class="demoStream" id="demoStream"></div>
    <div class="demoNote hidden" id="demoNote">示範結束——登入後就能用自己的句子。</div>
  </div>

  <!-- ============ 登入後 ============ -->
  <div class="hidden" id="appScreen" style="display:flex; flex-direction:column; flex:1; min-height:0">
    <div class="top">
      <button class="sceneBtn" id="sceneBtn">🧭 旅遊・通用</button>
      <button class="langBtn" id="langBtn">対 日本語 ▾</button>
      <div class="seg" role="group" aria-label="版面">
        <button id="mChat" aria-pressed="true">對談</button>
        <button id="mFace" aria-pressed="false">面對面</button>
      </div>
      <button class="engine" id="mEngine" data-fast="false">精準</button>
      <button class="testChip" id="testChip" data-on="false">🧪 測試</button>
    </div>
    <div class="testbar hidden" id="testbar"></div>

    <div class="chatwrap" id="chatMode">
      <div class="stream" id="stream" aria-live="polite"></div>
      <div class="statusline" id="status">按住說話</div>
      <div class="pttbar">
        <button class="ptt me" id="pttMe"><span class="big">按住・我說中文</span><span class="sub" id="pttMeSub">→ 日本語</span></button>

      <div class="divider" id="faceDivider">⇅ 面對面・上側は相手用</div>

        <div class="feed" id="feedMine"></div>

        <button class="fptt" id="fpttMine">按住・我說中文</button>
      </div>
    </div>
  </div>
</div>

<script>
"use strict";
/* ============ 語言包(對方語言;介面/按鍵文案跟著換) ============ */
const LANGS = {
  ja: { label:"日本語", pttThem:"押して話す", pttThemSub:"→ 中文", holdStatus:"押しながら話してください",
        divider:"⇅ 面對面・上側は相手用", who:"(日本語)", ghostWho:"相手(中国語)" },
  en: { label:"English", pttThem:"Hold to speak", pttThemSub:"→ Chinese", holdStatus:"Hold the button and speak",
        divider:"⇅ Face to face · top side is for them", who:"(English)", ghostWho:"They said (Chinese)" },
};

/* ============ 場景(左上切換;引導例句因場景而異) ============ */
const SCENES = {
  general: {
    label:"🧭 旅遊・通用",
    ghostTitle:"把「人・事・時・地」說清楚,翻譯會更準。試著說:",
    ghosts:[ "「我要一份〇〇,〇〇不要加。」", "「請問〇〇在哪裡?怎麼走?」", "「我〇點有預約,名字是〇〇。」" ],
    script:"ramen",
  },
  emergency: {
    label:"🆘 旅遊・緊急",
    ghostTitle:"求助時照這個句型,一次講完整:",
    ghosts:[ "「我在(地點),我的同伴(發生什麼),請幫我(需要的協助)。」",
             "例:「我在車站東口,朋友昏倒了,請叫救護車。」",
             "例:「我的護照不見了,請問要去哪裡報案?」" ],
    script:"emergency",
  },
  business: { label:"💼 商務會談(即將推出)", ghostTitle:"", ghosts:[], script:null, disabled:true },
};
const SCENE_ORDER = ["general", "emergency", "business"];

/* ============ 劇本(zh / ja / en 三語;them 的 stt 依語言取) ============ */
const SCRIPTS = {
  ramen: [
    { side:"me", zh:"你好,我要一份豚骨拉麵,麵要硬一點。",
      ja:"すみません、豚骨ラーメンを一つください。麺は硬めでお願いします。",
      en:"Hi, one tonkotsu ramen please, with the noodles on the firm side.",
      badge:"ok", back:"你好,請給我一份豚骨拉麵,麵請做硬一點。" },
    { side:"them", ja:"かしこまりました。トッピングはいかがなさいますか?",
      en:"Sure. Would you like any toppings?",
      zh:"好的。請問配料要加什麼嗎?", badge:"ok" },
    { side:"me", zh:"我對瞎子過敏,餐點請不要放任何海鮮。",
      ja:"私は盲人にアレルギーがあるので、料理には魚介類を入れないでください。",
      en:"I'm allergic to blind people, so please don't put any seafood in my food.",
      badge:"warn", back:"我對「盲人」過敏,餐點請不要放海鮮。",
      hint:"意思可能跑掉了——長按這則氣泡重講一次", needsRedo:true },
    { side:"me", zh:"我對『蝦子』過敏,餐點請不要放任何海鮮。",
      ja:"エビアレルギーがあるので、料理には魚介類を一切入れないでください。",
      en:"I'm allergic to shrimp — please don't put any seafood in my food.",
      badge:"ok", back:"我有蝦子過敏,餐點請完全不要放海鮮。", isRedo:true },
    { side:"them", ja:"エビは入っておりません。ご安心ください。",
      en:"There's no shrimp in it — don't worry.",
      zh:"沒有放蝦子,請放心。", badge:"ok" },
    { side:"me", zh:"太好了,謝謝你!", ja:"よかった、ありがとうございます!", en:"Great, thank you!",
      badge:"ok", back:"太好了,非常感謝!" },
  ],
  emergency: [
    { side:"me", zh:"救命!我在車站東口,我朋友昏倒了,請幫我叫救護車!",
      ja:"助けてください!駅の東口にいます。友達が倒れました。救急車を呼んでください!",
      en:"Help! I'm at the station's east exit — my friend has collapsed. Please call an ambulance!",
      badge:"ok", back:"救命!我在車站東口,朋友昏倒了,請叫救護車!" },
    { side:"them", ja:"わかりました、すぐ呼びます。意識はありますか?",
      en:"Understood, calling now. Are they conscious?",
      zh:"好的,馬上叫。他還有意識嗎?", badge:"ok" },
    { side:"me", zh:"有,但他不能打青黴素,他會過敏。",
      ja:"はい。ただ、ペニシリンは打てません。アレルギーがあります。",
      en:"Yes, but he can't have penicillin — he's allergic.",
      badge:"ok", back:"有意識。但他對青黴素過敏,不能施打。" },
  ],
};

/* ============ 測試模式:T50 抽樣照念(登入後,記錄表現) ============ */
const TEST_LINES = [
  { id:"T001", zh:"請問車站在哪裡?怎麼走比較快?", ja:"すみません、駅はどこですか?どう行くのが一番早いですか?", en:"Excuse me, where is the station? What's the fastest way?" },
  { id:"T007", zh:"我要兩張到京都的車票,大人一張、小孩一張。", ja:"京都までの切符を2枚ください。大人1枚、子ども1枚です。", en:"Two tickets to Kyoto please — one adult, one child." },
  { id:"T014", zh:"這個不要辣,我不太能吃辣。", ja:"これは辛くしないでください。辛いものが苦手なんです。", en:"No spicy for this one — I can't really handle spicy food." },
  { id:"T022", zh:"太貴了,算我三千塊可以嗎?", ja:"高すぎます。3000円にしてもらえませんか?", en:"That's too expensive — can you do three thousand?" },
  { id:"T030", zh:"請問退房時間是早上十點還是十一點?", ja:"チェックアウトは朝10時ですか、それとも11時ですか?", en:"Is checkout at ten or eleven in the morning?" },
  { id:"T037", zh:"我的房間號碼是七〇二,我朋友昏倒了。", ja:"部屋番号は702です。友達が倒れました。", en:"My room number is 702 — my friend has collapsed." },
];

/* ============ 狀態 ============ */
const S = { idx:0, busy:false, fast:false, awaitRedo:false, lang:"ja", scene:"general",
            test:false, testIdx:0, lines:[] };
const $ = (id) => document.getElementById(id);
const sleep = (ms) => new Promise(r => setTimeout(r, ms));
const script = () => S.test
  ? TEST_LINES.map((t) => ({ side:"me", zh:t.zh, ja:t.ja, en:t.en, badge:"ok", back:t.zh, testId:t.id }))
  : (SCRIPTS[SCENES[S.scene].script] ?? []);
const txOf = (l) => l.side === "me" ? l[S.lang] : l.zh;      // 顯示的譯文
const srcOf = (l) => l.side === "me" ? l.zh : l[S.lang];     // 顯示的原文(STT)

/* ============ 登入前示範(v2.1:真氣泡向下長,秀出誤聽→重講) ============ */
let demoPlaying = false;
async function demoBubble(l, opts = {}){
  const el = document.createElement("div");
  el.className = "msg " + l.side;
  el.innerHTML = `
    <span class="who">${l.side === "me" ? "旅客(中文)" : "店員(日本語)"}</span>
    <div class="bubble"><div class="src"></div><div class="tx"></div></div>
    <div class="rowmeta"></div>`;
  $("demoStream").appendChild(el);
  const src = l.side === "me" ? l.zh : l.ja, tx = l.side === "me" ? l.ja : l.zh;
  const srcEl = el.querySelector(".src"), txEl = el.querySelector(".tx");
  const chars = [...src];
  for (let i = 0; i < chars.length; i++){
    srcEl.textContent = (opts.redo ? "🔁 " : "") + chars.slice(0, i + 1).join("");
    await sleep(650 / chars.length);
  }
  el.scrollIntoView({ block:"end", behavior:"smooth" });
  await sleep(700);
  txEl.textContent = tx;
  el.scrollIntoView({ block:"end", behavior:"smooth" });
  if (l.side === "me"){
    await sleep(500);
    const meta = el.querySelector(".rowmeta");
    meta.innerHTML = `<span class="badge ${l.badge}">${l.badge === "ok" ? "✓ 意思一致" : "⚠ 確認一下"}</span>`;
    if (l.badge === "warn"){
      await sleep(600);
      const d = document.createElement("div");
      d.className = "backtx";
      d.innerHTML = `對方聽到的意思:「${l.back}」<div class="hint">manemu 發現意思跑掉了——重講一次就好</div>`;
      el.querySelector(".bubble").appendChild(d);
      el.scrollIntoView({ block:"end", behavior:"smooth" });
      await sleep(1400);
      srcEl.innerHTML = `<span class="redoflag">${src}</span> 已重講 ↓`;
      meta.innerHTML = "";
      d.remove();
    }
  }
  await sleep(800);
  return el;
}
$("demoBtn").addEventListener("click", async () => {
  if (demoPlaying) return;
  demoPlaying = true;
  $("demoBtn").disabled = true;
  $("demoStream").innerHTML = "";
  $("demoNote").classList.add("hidden");
  for (const l of [SCRIPTS.ramen[0], SCRIPTS.ramen[1], SCRIPTS.ramen[2], SCRIPTS.ramen[3], SCRIPTS.ramen[4]]){
    await demoBubble(l, { redo: !!l.isRedo });
  }
  $("demoNote").classList.remove("hidden");
  $("demoNote").scrollIntoView({ block:"end", behavior:"smooth" });
  $("demoBtn").disabled = false;
  demoPlaying = false;
});
$("ssoBtn").addEventListener("click", async () => {
  $("ssoBtn").textContent = "檢查受邀名單…";
  await sleep(700);                                  // 真實版:R2 白名單查 email
  $("loginScreen").classList.add("hidden");
  $("appScreen").classList.remove("hidden");
  renderEmpty(); syncFace(); applyLang();
});
$("kLogout")?.addEventListener("click", () => {
  $("appScreen").classList.add("hidden");
  $("loginScreen").classList.remove("hidden");
  $("ssoBtn").textContent = "使用 Google 登入";
});

/* ============ 空白引導(因場景) ============ */
function renderEmpty(){
  if (S.idx > 0 || S.test) return;
  const sc = SCENES[S.scene];
  $("stream").innerHTML = `<div class="ghost"><b>${sc.ghostTitle}</b>${sc.ghosts.map((g) => `<span class="gx">${g}</span>`).join("")}</div>`;
}

/* ============ 對談模式 ============ */
function addBubble(l){
  if (S.idx === 0) $("stream").innerHTML = "";
  const el = document.createElement("div");
  el.className = "msg " + l.side;
  el.dataset.idx = S.idx;
  el.innerHTML = `
    <span class="who">${l.side === "me" ? "我(中文)" : "對方" + LANGS[S.lang].who}</span>
    <div class="bubble"><div class="src">${l.isRedo ? "🔁 " : ""}</div><div class="tx"></div></div>
    <div class="rowmeta"></div>`;
  $("stream").appendChild(el);
  el.scrollIntoView({ block:"end" });
  return el;
}
function attachRedo(el){
  const bub = el.querySelector(".bubble");
  let t;
  const start = () => { t = setTimeout(() => markRedone(el), 600); };
  const stop = () => clearTimeout(t);
  bub.addEventListener("pointerdown", start);
  bub.addEventListener("pointerup", stop);
  bub.addEventListener("pointerleave", stop);
}
function markRedone(el){
  const l = script()[el.dataset.idx];
  el.querySelector(".src").innerHTML = `<span class="redoflag">${srcOf(l)}</span> 已重講 ↓`;
  el.querySelector(".rowmeta").innerHTML = "";
  el.querySelector(".backtx")?.remove();
  S.awaitRedo = false;
  setStatus("好,再按住重講一次");
}

/* ============ 核心流程 ============ */
function nextLine(side){
  const l = script()[S.idx];
  if (!l) return null;
  if (S.awaitRedo && !l.isRedo) return null;
  if (l.side !== side) return null;
  return l;
}
async function playLine(l, ui){
  S.busy = true;
  const t0 = performance.now();
  ui.status("連線中…", true);
  await sleep(500);
  ui.status("聆聽中 <span class='wave'><i></i><i></i><i></i><i></i></span>", true);
  const el = ui.begin(l);
  const src = srcOf(l), tx = txOf(l), chars = [...src];
  for (let i = 0; i < chars.length; i++){
    el.srcEl.textContent = (l.isRedo ? "🔁 " : "") + chars.slice(0, i + 1).join("");
    if (S.fast && i > 4) el.txEl.textContent = [...tx].slice(0, Math.floor([...tx].length * (i - 3) / chars.length)).join("");
    await sleep(1900 / chars.length);
  }
  ui.status("放開了・翻譯中…", true);
  await sleep(S.fast ? 250 : 1000);
  el.txEl.textContent = tx;
  ui.status("🔊 播放譯音(此時麥克風關閉)", true);
  el.host?.classList.add("speaking");
  await sleep(1600);
  el.host?.classList.remove("speaking");
  ui.done(l, el, ((performance.now() - t0) / 1000).toFixed(1));
  S.busy = false;
  if (l.needsRedo) S.awaitRedo = true;
  S.idx++;
  syncFace();
  if (S.test) updateTestbar();
  ui.status(S.idx >= script().length ? (S.test ? "測試完成・結果已記錄 ✓" : "劇本結束・↺ 可重播") : "按住說話", false);
}

const chatUI = {
  begin(l){
    const host = addBubble(l);
    return { host, srcEl: host.querySelector(".src"), txEl: host.querySelector(".tx") };
  },
  done(l, el, lag){
    const meta = el.host.querySelector(".rowmeta");
    meta.innerHTML = `<span class="lat">${lag}s</span>` + (S.test ? `<span class="lat">已記錄</span>` : "");
    if (l.side === "me" && !S.test){
      const b = document.createElement("button");
      b.className = "badge " + l.badge;
      b.textContent = l.badge === "ok" ? "✓ 意思一致" : "⚠ 確認一下";
      b.addEventListener("click", () => {
        if (el.host.querySelector(".backtx")) return;
        const d = document.createElement("div");
        d.className = "backtx" + (l.badge === "ok" ? " ok" : "");
        d.innerHTML = `對方聽到的意思:「${l.back}」` + (l.hint ? `<div class="hint">${l.hint}</div>` : "");
        el.host.querySelector(".bubble").appendChild(d);
        el.host.scrollIntoView({ block:"end" });
      });
      meta.appendChild(b);
      if (l.badge === "warn") b.click();
    }
    if (l.needsRedo) attachRedo(el.host);
    el.host.scrollIntoView({ block:"end" });
  },
  status(html, busyState){ $("status").innerHTML = html; setPtt(busyState); },
};
function setStatus(t){ $("status").textContent = t; }
function setPtt(disabled){
  $("pttMe").disabled = disabled;
  $("pttThem").disabled = disabled || S.test;   // 測試模式只念中文側
}

/* ============ 面對面(v2:同級字、氣泡配色、雙側完整) ============ */
function syncFace(){
  const mine = [], other = [];
  const gh = SCENES[S.scene];
  if (S.idx === 0 && !S.test){
    $("feedMine").innerHTML = `<div class="fghost"><b>${gh.ghostTitle}</b><br>${gh.ghosts.join("<br>")}</div>`;
    $("feedOther").innerHTML = "";
    return;
  }
  for (let i = 0; i < S.idx; i++){
    const l = script()[i];
    if (l.needsRedo && script()[i + 1]?.isRedo && i + 1 < S.idx) continue;
    const badge = (l.side === "me" && !S.test) ? `<span class="fbadge ${l.badge}">${l.badge === "ok" ? "✓" : "⚠"}</span>` : "";
    // 下半(我,中文):我說的=me 泡、對方說的=them 泡,全部中文
    mine.push(`<div class="fmsg ${l.side}">${l.side === "me" ? l.zh : l.zh}${l.side === "me" ? badge : ""}<small>${l.side === "me" ? "你說的" : "對方" + LANGS[S.lang].who}</small></div>`);
    // 上半(對方語言):鏡像——對方說的=me 泡(對他而言是自己),我說的=them 泡
    other.push(`<div class="fmsg ${l.side === "them" ? "me" : "them"}">${l.side === "me" ? l[S.lang] : l[S.lang]}<small>${l.side === "them" ? (S.lang === "ja" ? "あなた" : "You") : (S.lang === "ja" ? "相手(中国語)" : "Them (Chinese)")}</small></div>`);
  }
  $("feedMine").innerHTML = mine.join("");
  $("feedOther").innerHTML = other.join("");
  $("feedMine").scrollTop = $("feedMine").scrollHeight;
  $("feedOther").scrollTop = $("feedOther").scrollHeight;
}
function faceUI(half){
  const st = half === "mine" ? $("stMine") : $("stOther");
  return {
    begin(l){
      const own = half === "mine" ? $("feedMine") : $("feedOther");
      const opp = half === "mine" ? $("feedOther") : $("feedMine");
      if (S.idx === 0){ own.innerHTML = ""; opp.innerHTML = ""; }
      const d = document.createElement("div");
      d.className = "fmsg me";
      d.innerHTML = `<span class="fsrc"></span><small>${half === "mine" ? "你說的" : (S.lang === "ja" ? "あなた" : "You")}</small>`;
      own.appendChild(d);
      const od = document.createElement("div");
      od.className = "fmsg them";
      od.innerHTML = `<span class="ftx"></span><small>${half === "mine" ? "對方即將聽到" : "…"}</small>`;
      opp.appendChild(od);
      own.scrollTop = own.scrollHeight; opp.scrollTop = opp.scrollHeight;
      return { host:d, srcEl:d.querySelector(".fsrc"), txEl:od.querySelector(".ftx") };
    },
    done(){ syncFace(); },
    status(html, busyState){
      st.innerHTML = html;
      $("fpttMine").disabled = busyState;
      $("fpttOther").disabled = busyState || S.test;
    },
  };
}

/* ============ PTT ============ */
function bindHold(btn, side, ui){
  btn.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    if (S.busy) return;
    const l = nextLine(side);
    if (!l){
      ui.status(S.awaitRedo ? "先長按錯誤的氣泡取消,再重講" :
        S.idx >= script().length ? "已結束・↺ 重播" :
        (script()[S.idx]?.side === "me" ? "輪到:中文這側" : "輪到:對方那側"), false);
      return;
    }
    btn.classList.add("holding");
    playLine(l, ui).then(() => btn.classList.remove("holding"));
  });
}
bindHold($("pttMe"), "me", chatUI);
bindHold($("pttThem"), "them", chatUI);
bindHold($("fpttMine"), "me", faceUI("mine"));
bindHold($("fpttOther"), "them", faceUI("other"));

/* ============ 頂列:場景/語言/版面/引擎/測試 ============ */
$("sceneBtn").addEventListener("click", () => {
  let i = SCENE_ORDER.indexOf(S.scene);
  do { i = (i + 1) % SCENE_ORDER.length; } while (SCENES[SCENE_ORDER[i]].disabled && SCENE_ORDER[i] !== S.scene);
  if (SCENES[SCENE_ORDER[i]].disabled) return;
  S.scene = SCENE_ORDER[i];
  $("sceneBtn").textContent = SCENES[S.scene].label;
  resetConversation();
});
$("langBtn").addEventListener("click", () => {
  S.lang = S.lang === "ja" ? "en" : "ja";
  applyLang(); resetConversation();
});
function applyLang(){
  const L = LANGS[S.lang];
  $("langBtn").textContent = `対 ${L.label} ▾`;
  $("pttMeSub").textContent = `→ ${L.label}`;
  $("pttThemBig").textContent = L.pttThem;
  $("pttThemSub").textContent = L.pttThemSub;
  $("fpttOther").textContent = `${L.pttThem}(${L.label} → 中文)`;
  $("stOther").textContent = L.holdStatus;
  $("faceDivider").textContent = L.divider;
}
$("mChat").addEventListener("click", () => switchMode(false));
$("mFace").addEventListener("click", () => switchMode(true));
function switchMode(face){
  $("mChat").setAttribute("aria-pressed", String(!face));
  $("mFace").setAttribute("aria-pressed", String(face));
  $("chatMode").classList.toggle("hidden", face);
  $("faceMode").classList.toggle("hidden", !face);
  if (face) syncFace();
}
$("mEngine").addEventListener("click", () => {
  S.fast = !S.fast;
  $("mEngine").dataset.fast = String(S.fast);
  $("mEngine").textContent = S.fast ? "快速" : "精準";
  setStatus(S.fast ? "快速模式:邊講邊翻,請盯著確認文字" : "精準模式:講完約 1 秒出譯音");
});
$("testChip").addEventListener("click", () => {
  S.test = !S.test;
  $("testChip").dataset.on = String(S.test);
  $("testbar").classList.toggle("hidden", !S.test);
  resetConversation();
  if (S.test) updateTestbar();
});
function updateTestbar(){
  const t = TEST_LINES[Math.min(S.idx, TEST_LINES.length - 1)];
  $("testbar").innerHTML = S.idx >= TEST_LINES.length
    ? `✓ 測試完成:${TEST_LINES.length} 句已記錄,感謝!結果將用於評測報告。`
    : `<span class="rec"></span><b>測試模式 ${S.idx + 1}/${TEST_LINES.length}</b> 請照念:「${t.zh}」<br><small>(${t.id}・你的錄音與翻譯結果會被記錄)</small>`;
}
function resetConversation(){
  S.idx = 0; S.busy = false; S.awaitRedo = false;
  $("stream").innerHTML = ""; renderEmpty(); syncFace();
  setStatus("按住說話"); setPtt(false);
}
$("kTheme")?.addEventListener("click", () => {
  const r = document.documentElement;
  const cur = r.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  r.dataset.theme = cur === "dark" ? "light" : "dark";
});
$("kReset")?.addEventListener("click", resetConversation);
</script>
